name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up
      - name: Wait for infrastructure
        run: |
          for attempt in {1..60}; do
            if docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U nexvolt -d nexvolt && docker compose -f infra/docker-compose.yml exec -T redis redis-cli ping && curl -s -o /dev/null http://localhost:58333; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - run: pnpm build:packages
      - run: pnpm --filter @nexvolt/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t nexvolt-api:ci .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.example.in --build-arg NEXT_PUBLIC_S3_ORIGIN=https://nexvolt-private.s3.ap-south-1.amazonaws.com -t nexvolt-web:ci .
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200
      - name: Stop infrastructure
        if: always()
        run: pnpm infra:down
